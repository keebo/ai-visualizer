<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0b1116;overflow:hidden;
    font-family:-apple-system,'SF Pro Text',sans-serif}
  #log{position:fixed;top:0;left:0;right:0;bottom:86px;overflow-y:auto;
    padding:18px 16px}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:rgba(90,225,255,.25);border-radius:4px}
  .msg{max-width:86%;margin-bottom:10px;padding:9px 13px;border-radius:16px;
    font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;
    color:#e8f3f7}
  .you{background:rgba(90,225,255,.16);margin-left:auto;
    border-bottom-right-radius:5px}
  .them{background:rgba(150,180,200,.12);margin-right:auto;
    border-bottom-left-radius:5px}
  .who{display:block;font-size:10px;letter-spacing:.1em;opacity:.55;
    margin-bottom:3px;font-family:'SF Mono',Menlo,Consolas,monospace}
  .empty{color:#3a4a52;font-size:13px;padding-top:8px}
  #bar{position:fixed;left:12px;right:12px;bottom:12px;display:flex;
    align-items:flex-end;gap:10px;background:rgba(20,28,34,.95);
    border:1px solid rgba(90,225,255,.35);border-radius:20px;
    padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  #input{flex:1;resize:none;background:transparent;border:none;
    color:#e8f3f7;font:15px/1.4 -apple-system,'SF Pro Text',sans-serif;
    max-height:160px;overflow-y:auto;padding:4px 2px}
  #input:focus{outline:none}
  #input::placeholder{color:#5a7078}
  #send{flex:none;width:34px;height:34px;border-radius:50%;
    background:#5ae1ff;border:none;color:#01050a;font-size:16px;
    line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center}
  #send:hover{background:#8aeeff}
  #send:disabled{background:rgba(90,225,255,.25);cursor:default}
</style>
</head>
<body>
<div id="log"><div class="empty">Waiting for conversation…</div></div>
<div id="bar">
  <textarea id="input" rows="1" placeholder="Type your message…"></textarea>
  <button id="send" title="send">↑</button>
</div>
<script src="../../core.js"></script>
<script>
"use strict";
// sound:false -- same reasoning as transcript.html: this window is
// text-only and must never spawn its own thinking-sound player.
AV.init({sound:false});
AV.ready(a=>{document.title=(a.name||"Chat")+" — Chat";});

const logEl=document.getElementById("log");
const input=document.getElementById("input");
const send=document.getElementById("send");

function grow(){
  input.style.height="auto";
  input.style.height=Math.min(160,input.scrollHeight)+"px";
}
input.addEventListener("input",grow);

function submit(){
  const text=input.value.trim();
  if(!text)return;
  input.disabled=true;send.disabled=true;
  AV.sendTyped(text).then(()=>{input.value="";grow();})
    .catch(()=>{})
    .finally(()=>{input.disabled=false;send.disabled=false;input.focus();});
}
send.addEventListener("click",submit);
input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}
});

let lastSig=null;
let userScrolledUp=false;
logEl.addEventListener("scroll",()=>{
  userScrolledUp=logEl.scrollTop+logEl.clientHeight<logEl.scrollHeight-40;
});

// setInterval, not requestAnimationFrame -- same lesson as
// transcript.html: rAF suspends entirely in an unfocused window, and a
// pop-out's whole job is being readable while something else has focus.
let lastT=performance.now();
function render(){
  const now=performance.now();
  const dt=Math.min(2000,now-lastT);lastT=now;
  AV.tick(dt);
  const items=AV.transcript||[];
  // Diff on newest-entry timestamp + length, not length alone --
  // backtalk caps this list at ~60 and slides the window forward, so
  // length stops changing in a long session (transcript.html's bug,
  // found live 2026-09-06, avoided here from the start).
  const last=items.length?items[items.length-1]:null;
  const sig=items.length+"|"+(last?last.ts:"");
  if(sig!==lastSig){
    lastSig=sig;
    if(!items.length){
      logEl.innerHTML='<div class="empty">Waiting for conversation…</div>';
    }else{
      const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      logEl.innerHTML=items.map(it=>{
        const mine=String(it.role||"").toLowerCase()==="you";
        const who=mine?"YOU":String(it.role||AV.name||"AGENT").toUpperCase();
        return `<div class="msg ${mine?"you":"them"}"><span class="who">${esc(who)}</span>${esc(String(it.text||""))}</div>`;
      }).join("");
      if(!userScrolledUp)logEl.scrollTop=logEl.scrollHeight;
    }
  }
}
render();
setInterval(render,300);
input.focus();
</script>
</body>
</html>
