<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transcript</title>
<style>
  @font-face{font-family:"Orbitron";src:url("../../assets/Orbitron-Variable.ttf")}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#01050a;overflow:hidden;
    font-family:'SF Mono',Menlo,Consolas,monospace}
  #head{position:fixed;top:0;left:0;right:0;height:34px;display:flex;
    align-items:center;gap:10px;padding:0 12px;
    font:11px 'Orbitron',sans-serif;letter-spacing:.15em;color:#5ae1ff;
    background:rgba(90,225,255,.08);border-bottom:1px solid rgba(90,225,255,.2)}
  #head input[type=range]{width:80px;accent-color:#5ae1ff;cursor:pointer}
  #glass{position:fixed;top:34px;left:0;right:0;bottom:0;overflow-y:auto;
    padding:14px 16px}
  #glass::-webkit-scrollbar{width:8px}
  #glass::-webkit-scrollbar-thumb{background:rgba(90,225,255,.25);border-radius:4px}
  .line{font-size:13px;line-height:1.5;margin-bottom:6px;white-space:pre-wrap;
    word-wrap:break-word}
  .line .role{font-weight:bold;letter-spacing:.05em}
  .you .role{color:#96e1ff}
  .them .role{color:#96b4c8}
  .empty{color:#3a4a52;font-size:12px;padding-top:8px}
</style>
</head>
<body>
<div id="head">
  <span>TRANSPARENCY</span>
  <input type="range" id="glassAlpha" min="0.15" max="1" step="0.05">
</div>
<div id="glass"><div class="empty">Waiting for conversation…</div></div>
<script src="../../core.js"></script>
<script>
"use strict";
AV.init({});
AV.ready(a=>{document.title=(a.name||"Transcript")+" — Transcript";});

const glass=document.getElementById("glass");
const alphaCtl=document.getElementById("glassAlpha");
// Real see-through-to-the-desktop transparency isn't something a plain
// browser popup can do -- that needs a native window (a future build).
// This slider fades the panel toward the page's own dark background
// instead, same idea as a HUD glass panel, achievable right now with
// nothing but CSS.
let alpha=0.8;
try{const saved=localStorage.getItem("transcript_alpha");if(saved)alpha=parseFloat(saved);}catch(e){}
function applyAlpha(){
  glass.style.background=`rgba(2,10,18,${alpha})`;
  alphaCtl.value=alpha;
}
applyAlpha();
alphaCtl.addEventListener("input",()=>{
  alpha=parseFloat(alphaCtl.value);
  applyAlpha();
  try{localStorage.setItem("transcript_alpha",alpha);}catch(e){}
});

let lastLen=-1;
let userScrolledUp=false;
glass.addEventListener("scroll",()=>{
  userScrolledUp=glass.scrollTop+glass.clientHeight<glass.scrollHeight-40;
});

function render(){
  const items=AV.transcript||[];
  if(items.length!==lastLen){
    lastLen=items.length;
    if(!items.length){
      glass.innerHTML='<div class="empty">Waiting for conversation…</div>';
    }else{
      const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      glass.innerHTML=items.map(it=>{
        const mine=String(it.role||"").toLowerCase()==="you";
        const role=mine?"YOU":String(it.role||AV.name||"AGENT").toUpperCase();
        const text=esc(String(it.text||""));
        return `<div class="line ${mine?"you":"them"}"><span class="role">${esc(role)}:</span> ${text}</div>`;
      }).join("");
      if(!userScrolledUp)glass.scrollTop=glass.scrollHeight;
    }
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
