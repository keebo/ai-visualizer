<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transcript</title>
<style>
  @font-face{font-family:"Orbitron";src:url("../../assets/Orbitron-Variable.ttf")}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#01050a;overflow:hidden;
    font-family:'SF Mono',Menlo,Consolas,monospace}
  #glass{position:fixed;inset:0;overflow-y:auto;padding:14px 16px;
    background:rgba(2,10,18,.92)}
  #glass::-webkit-scrollbar{width:8px}
  #glass::-webkit-scrollbar-thumb{background:rgba(90,225,255,.25);border-radius:4px}
  .line{font-size:13px;line-height:1.5;margin-bottom:6px;white-space:pre-wrap;
    word-wrap:break-word;color:#d8e6ec}
  .line .role{font-weight:bold;letter-spacing:.05em}
  .you .role{color:#96e1ff}
  .them .role{color:#96b4c8}
  .empty{color:#3a4a52;font-size:12px;padding-top:8px}
</style>
</head>
<body>
<div id="glass"><div class="empty">Waiting for conversation…</div></div>
<script src="../../core.js"></script>
<script>
"use strict";
// sound:false -- this window only ever displays text, and without this
// it'd create its own independent thinking-sound audio element/toggle,
// which could double up the cue against the main reactor page if that
// sound is ever turned on.
AV.init({sound:false});
AV.ready(a=>{document.title=(a.name||"Transcript")+" — Transcript";});

const glass=document.getElementById("glass");
// No transparency control here -- a plain browser popup can't reveal
// the real desktop behind it, only fade toward its own dark background,
// which read as pointless with nothing distinct behind it to reveal
// (Kevin's call, 2026-09-06). Revisit once there's a native app that can
// actually show what's underneath.

let lastLen=null;
let userScrolledUp=false;
glass.addEventListener("scroll",()=>{
  userScrolledUp=glass.scrollTop+glass.clientHeight<glass.scrollHeight-40;
});

// setInterval, not requestAnimationFrame -- found 2026-09-06 that rAF
// callbacks get throttled to near-zero by the browser the moment this
// window isn't the focused/frontmost one, which is the ENTIRE point of
// popping the transcript out (reading it while something else has
// focus). setInterval is still clamped in a backgrounded window, but
// only to roughly once a second, not paused outright -- plenty for text
// that isn't animating.
let lastT=performance.now();
function render(){
  const now=performance.now();
  const dt=Math.min(2000,now-lastT);lastT=now;
  // AV.transcript (and every other AV.* field) only refreshes when a
  // page calls AV.tick() itself -- core.js's own /state polling just
  // fills a private buffer behind the scenes. Every other face does
  // this from its own render loop; this page never did, so the panel
  // was empty by construction, not from any real data problem.
  AV.tick(dt);
  const items=AV.transcript||[];
  // backtalk caps this list at ~60 entries and slides the window forward,
  // so length alone stops changing once a long session passes that cap --
  // found 2026-09-06 after it silently stopped updating mid-conversation.
  // The newest entry's own timestamp always changes on a real new line,
  // capped or not.
  const last=items.length?items[items.length-1]:null;
  const sig=items.length+"|"+(last?last.ts:"");
  if(sig!==lastLen){
    lastLen=sig;
    if(!items.length){
      glass.innerHTML='<div class="empty">Waiting for conversation…</div>';
    }else{
      const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      glass.innerHTML=items.map(it=>{
        const mine=String(it.role||"").toLowerCase()==="you";
        const role=mine?"YOU":String(it.role||AV.name||"AGENT").toUpperCase();
        const text=esc(String(it.text||""));
        return `<div class="line ${mine?"you":"them"}"><span class="role">${esc(role)}:</span> ${text}</div>`;
      }).join("");
      if(!userScrolledUp)glass.scrollTop=glass.scrollHeight;
    }
  }
}
render();
setInterval(render,300);
</script>
</body>
</html>
